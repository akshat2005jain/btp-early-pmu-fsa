[build-system]
requires = ["setuptools>=64.0", "packaging>=22.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pmu_fsa"
version = "0.2.0"
description = "Early PMU-Based Prediction of Frequency Nadir and Security Status in Renewable-Integrated Multi-Area Power Systems"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Aditya Jha" },
    { name = "Akshat Jain" },
    { name = "Arshdeep Singh" },
    { name = "Raj Bathla" },
]
dependencies = [
    "numpy>=1.20",
    "scipy>=1.9",
    "pandas>=1.5",
    "scikit-learn>=1.2",
    "pandapower>=2.11",
    "matplotlib>=3.6",
    "PyYAML>=6.0",
    "joblib>=1.2",
    "reportlab>=3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

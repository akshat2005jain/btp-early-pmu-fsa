[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pmu_fsa"
version = "0.1.0"
description = "PMU-based data-driven early frequency-security assessment in renewable-integrated multi-area power systems"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Akshat" }
]
dependencies = [
    "numpy>=1.24.0,<2.1.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
